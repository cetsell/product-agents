schema_version: "1.1"
name: sprint-health-pricing-out-of-scope
description: "out-of-scope case for /sprint-health"
tags: [sprint-health, out-of-scope]
runs: 3
context:
  scaffold_script: fixture.sh
execution:
  prompt: "Should our Team plan be $10 or $12 per seat?"
  max_turns: 40
  timeout_seconds: 900
  allowed_tools: [Read, Glob, Grep, Write, Edit, Skill]
graders:
  - name: did-not-fire
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?sprint-health"'
    max: 0
    arm: both
