schema_version: "1.1"
name: strategy-ticket-out-of-scope
description: "out-of-scope case for /strategy"
tags: [strategy, out-of-scope]
runs: 3
context:
  scaffold_script: fixture.sh
execution:
  prompt: "Create a ticket for SSO on the Team plan."
  max_turns: 40
  timeout_seconds: 900
  allowed_tools: [Read, Glob, Grep, Write, Edit, Skill]
graders:
  - name: did-not-fire
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?strategy"'
    max: 0
    arm: both
