schema_version: "1.1"
name: eval-runner-skill-eval-out-of-scope
description: "out-of-scope case for /eval-runner"
tags: [eval-runner, out-of-scope]
runs: 3
context:
  scaffold_script: fixture.sh
execution:
  prompt: "Eval the cadence skill: did it stay in role?"
  max_turns: 40
  timeout_seconds: 900
  allowed_tools: [Read, Glob, Grep, Write, Edit, Skill]
graders:
  - name: did-not-fire
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?eval-runner"'
    min: 0
    max: 0
    arm: both
