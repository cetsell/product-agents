schema_version: "1.1"
name: evidence-loop-prd-out-of-scope
description: "out-of-scope case for /evidence-loop"
tags: [evidence-loop, out-of-scope]
runs: 3
context:
  scaffold_script: fixture.sh
execution:
  prompt: "Write a PRD for the Slack digest."
  max_turns: 40
  timeout_seconds: 900
  allowed_tools: [Read, Glob, Grep, Write, Edit, Skill]
graders:
  - name: did-not-fire
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?evidence-loop"'
    max: 0
    arm: both
