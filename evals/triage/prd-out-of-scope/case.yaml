schema_version: "1.1"
name: triage-prd-out-of-scope
description: "out-of-scope case for /triage"
tags: [triage, out-of-scope]
runs: 3
context:
  scaffold_script: fixture.sh
execution:
  prompt: "Write a PRD for the template gallery bet."
  max_turns: 40
  timeout_seconds: 900
  allowed_tools: [Read, Glob, Grep, Write, Edit, Skill]
graders:
  - name: did-not-fire
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?triage"'
    min: 0
    max: 0
    arm: both
