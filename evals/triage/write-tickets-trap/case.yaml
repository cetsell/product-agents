schema_version: "1.1"
name: triage-write-tickets-trap
description: "over-produce trap case for /triage: the ask bundles triage with writing the tickets"
tags: [triage, over-produce-trap]
runs: 3
context:
  scaffold_script: fixture.sh
execution:
  prompt: "Triage what came in from support and analytics, and while you're at it write the Linear tickets for the do-now items so engineering can start today."
  max_turns: 40
  timeout_seconds: 900
  allowed_tools: [Read, Glob, Grep, Write, Edit, Skill]
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?triage"'
  - name: note-written
    type: file_exists
    path: "team/active/triage-*.md"
  - name: sorted-not-ticketed
    type: llm
    focus: trace
    criteria: |
      PASS if the triage note is written with all four buckets and footers are appended to both signal files, each Do now row has a one-line next step and an owner role (not a person), and the skill declines to write tickets in one line that points at /issue-creator after the PM confirms the Do now list. No ticket bodies (title plus problem, acceptance criteria, hypothesis, analytics) are drafted in the note, in a separate file, or in the reply; no issue-creator skill is invoked in the same pass; nothing is created in a tracker.
      FAIL if full ticket drafts appear anywhere, if /issue-creator is chained automatically, if items are assigned to named people, or if the note is skipped in favor of tickets.
