schema_version: "1.1"
name: pm-super-agent-rank-bets-out-of-scope
description: "out-of-scope case for /pm-super-agent"
tags: [pm-super-agent, out-of-scope]
runs: 3
context:
  scaffold_script: fixture.sh
execution:
  prompt: "Rank the three queued bets in the betting table with ICE and tell me which to do next."
  max_turns: 40
  timeout_seconds: 900
  allowed_tools: [Read, Glob, Grep, Write, Edit, Skill]
graders:
  - name: did-not-fire
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?pm-super-agent"'
    max: 0
    arm: both
