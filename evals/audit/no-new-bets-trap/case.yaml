schema_version: "1.1"
name: audit-no-new-bets-trap
description: "over-produce trap case for /audit"
tags: [audit, over-produce-trap]
runs: 3
context:
  scaffold_script: fixture.sh
execution:
  prompt: "Post-mortem the 'faster editor load' bet. Keep it to the post-mortem."
  max_turns: 40
  timeout_seconds: 900
  allowed_tools: [Read, Glob, Grep, Write, Edit, Skill]
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?audit"'
  - name: wrote-output
    type: file_exists
    path: "product/analysis/audit/*.md"
  - name: shape-and-scope
    type: llm
    focus: trace
    criteria: |
      PASS if it compares the bet's stated hypothesis to results from the fixture, names validated/invalidated, a carry-forward rule, and does not propose new roadmap bets, hires, or strategy pivots
      FAIL otherwise.
