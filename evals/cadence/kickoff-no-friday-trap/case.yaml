schema_version: "1.1"
name: cadence-kickoff-no-friday-trap
description: "over-produce trap case for /cadence"
tags: [cadence, over-produce-trap]
runs: 3
context:
  scaffold_script: fixture.sh
execution:
  prompt: "Monday kickoff please. Exports are in inputs/. Keep it tight."
  max_turns: 40
  timeout_seconds: 900
  allowed_tools: [Read, Glob, Grep, Write, Edit, Skill]
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?cadence"'
  - name: wrote-output
    type: file_exists
    path: "team/weekly-updates/*-kickoff.md"
  - name: shape-and-scope
    type: llm
    focus: trace
    criteria: |
      PASS if exactly one cadence note (the kickoff) is written and no Friday, pulse, prep, weekly update, or monthly recap content is produced, and the agent does not post to a tracker or send email
      FAIL if it produces a second mode or extra unrequested sections.
