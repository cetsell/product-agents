name: Freshness Check

on:
  schedule:
    # Every Monday at 9am UTC
    - cron: '0 9 * * 1'
  workflow_dispatch: # Allow manual trigger

jobs:
  check-freshness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check file freshness
        id: freshness
        run: |
          TODAY=$(date +%s)
          STALE_FILES=""

          check_file() {
            local file="$1"
            local max_days="$2"
            local label="$3"

            if [ ! -f "$file" ]; then
              return
            fi

            # Extract most recent YYYY-MM-DD date from file
            LAST_DATE=$(grep -oP '\d{4}-\d{2}-\d{2}' "$file" | sort -r | head -1)

            if [ -z "$LAST_DATE" ]; then
              STALE_FILES="${STALE_FILES}\n| ${file} | No date found | ${max_days}d | ⚠️ Unknown | ${label} |"
              return
            fi

            FILE_DATE=$(date -d "$LAST_DATE" +%s 2>/dev/null || date -j -f "%Y-%m-%d" "$LAST_DATE" +%s 2>/dev/null)
            if [ -z "$FILE_DATE" ]; then
              return
            fi

            DAYS_OLD=$(( (TODAY - FILE_DATE) / 86400 ))

            if [ "$DAYS_OLD" -gt "$max_days" ]; then
              STALE_FILES="${STALE_FILES}\n| ${file} | ${LAST_DATE} | ${max_days}d | ${DAYS_OLD}d overdue | ${label} |"
            fi
          }

          # Check each monitored file against its freshness window
          check_file "product/roadmap/current-bet.md" 7 "PM"
          check_file "product/roadmap/betting-table.md" 14 "PM"
          check_file "product/roadmap/experiment-roadmap.md" 14 "PM"
          check_file "product/specs/CLAUDE.md" 14 "PM"
          check_file "gtm/campaign-tracker.md" 14 "GTM Lead"
          check_file "product/analytics/data-quality-log.md" 30 "Analytics"
          check_file "team/decisions/decisions.md" 30 "Team"

          if [ -n "$STALE_FILES" ]; then
            echo "stale=true" >> $GITHUB_OUTPUT
            # Write stale files list to file for the issue body
            echo -e "$STALE_FILES" > /tmp/stale_files.txt
          else
            echo "stale=false" >> $GITHUB_OUTPUT
          fi

      - name: Create issue for stale files
        if: steps.freshness.outputs.stale == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const staleFiles = fs.readFileSync('/tmp/stale_files.txt', 'utf8');
            const today = new Date().toISOString().split('T')[0];

            // Check if there's already an open freshness issue
            const existingIssues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'freshness-check'
            });

            // Close any existing freshness issues
            for (const issue of existingIssues.data) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: 'closed',
                state_reason: 'not_planned'
              });
            }

            // Create new issue
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Freshness check — ${today}`,
              labels: ['freshness-check'],
              body: `## Stale Files Detected\n\nThe following files are past their freshness window:\n\n| File | Last date found | Max age | Status | Owner |\n|------|----------------|---------|--------|-------|\n${staleFiles}\n\n## Action Required\n\nEach owner should update their file(s) or confirm the content is still accurate.\n\nSee [MAINTENANCE.md](../blob/master/MAINTENANCE.md) for the full freshness schedule.\n\n---\n*Auto-generated by freshness-check workflow*`
            });
