name: Repo checks

on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch: # allow manual trigger

jobs:
  scrub:
    name: Scrub check (no install-specific context)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Fail on deny-listed paths, metrics, tools, or names
        run: node scripts/scrub-check.mjs

  check-skills:
    name: Skill and agent conformance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      # Skills, agents, and frontmatter against documented Claude Code fields;
      # warnings fail the build too.
      - name: Lint skills and agents against the quality bar
        run: node check-skills.mjs --strict
