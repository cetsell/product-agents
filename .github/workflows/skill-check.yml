name: Repo checks

on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch: # allow manual trigger

jobs:
  scrub:
    name: Scrub check (no install-specific context)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Fail on deny-listed paths, metrics, tools, or names
        run: node scripts/scrub-check.mjs

  check-skills:
    name: Skill conformance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      # Hard rules (frontmatter, role line) always fail the build. Producer-rule
      # misses (output shape, TERMINATION) report as warnings until the backlog
      # is closed; flip to `--strict` here to make them blocking.
      - name: Lint skills against the quality bar
        run: node check-skills.mjs
