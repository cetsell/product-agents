# Proactive runs manifest — scheduler-agnostic.
#
# Each entry is a skill that fires WITHOUT being asked: on a schedule (time) or a
# trigger (event). These are NOT yet bound to an executor ("manifest first, wire
# later"). Until bound, a human runs them per the cadence in CLAUDE.md. To automate,
# bind each to /schedule, /loop, GitHub Actions, or a hook — see CLAUDE.md.
#
# Field reference:
#   when         time schedule (human-readable; translate to cron when wiring)
#   on           event trigger (for reactive runs)
#   skill        the skill that executes (⚠ in a comment = template only, not yet built)
#   pulls        the sources the run reads
#   output       where results land (shared + searchable — never private)
#   steward      the human accountable for the run AND the decision
#   decides      the specific decision point a human owns
#   evidence     true if output carries the Evidence Loop appendix
#   termination  the checkable stop condition (required on every run)

defaults:
  steward: PM
  open: true            # output is shared + searchable (River principle)
  evidence: false       # set true on any run whose output drives a decision

scheduled:
  - id: morning-brief
    when: "daily 07:30 local"
    skill: /morning-brief        # ⚠ template only — product-skills.md; build before wiring
    pulls: ["gmail inbox+sent 12h", "slack DMs+@mentions 12h", "calendar today+tomorrow AM"]
    output: pm-workflows/active/brief-{date}.md
    termination: "one page, <400 words, all sources processed"

  - id: sprint-health
    when: "Monday 09:00 local"
    skill: /sprint-health
    pulls: ["Linear (project health, velocity, blockers)", "Supernormal (recent meetings)"]
    output: pm-workflows/analysis/sprint-health-{date}.md
    decides: "PM triages flagged blockers before standup"
    termination: "report written with action items; every open blocker has an owner or a flag"

  - id: monday-kickoff
    when: "Monday 09:30 local"
    skill: /cadence              # monday kickoff mode
    pulls: ["product/roadmap/current-bet.md", "Linear active issues"]
    output: pm-workflows/weekly-updates/{date}-kickoff.md
    termination: "kickoff note posted; week's bet + top 3 named"

  - id: freshness-audit
    when: "Monday 09:00 UTC"     # aligns with existing GitHub Action + MAINTENANCE.md Audit duty
    skill: team-os-agent:audit
    pulls: ["all team-os files with a freshness date"]
    output: "flagged list of stale (>14d) files"
    decides: "PM decides what to refresh vs. retire"
    termination: "every dated file checked; stale ones listed with age"

  - id: midweek-pulse
    when: "Wednesday 12:00 local"
    skill: /cadence              # wednesday pulse mode
    pulls: ["Linear progress vs Monday plan"]
    output: pm-workflows/weekly-updates/{date}-pulse.md
    termination: "pulse note posted; on-track / at-risk per top-3 goal"

  - id: friday-refresh
    when: "Friday 15:00 local"   # MAINTENANCE.md Refresh duty (source of truth)
    skill: team-os-agent:refresh
    pulls: ["Linear (closed issues, velocity, initiative status)"]
    output: ["product/roadmap/current-bet.md", "product/roadmap/betting-table.md"]
    decides: "PM sets next week's bet"
    termination: "roadmap files updated with this week's data + dates"

  - id: friday-demo-and-update
    when: "Friday 15:30 local"
    skill: /cadence              # friday demo + weekly 'Hello All'
    pulls: ["Linear closed this week", "Notion edits", "Slack #shipping/#status"]
    output: pm-workflows/weekly-updates/{date}-hello-all.md
    evidence: true               # metrics cited to the team need sources + dates
    termination: "update written to template length; no invented metrics"

  - id: weekly-status
    when: "Friday 16:00 local"
    skill: /weekly-status        # ⚠ template only — product-skills.md; build before wiring
    pulls: ["Linear closed", "Notion", "Slack", "calendar meeting counts"]
    output: pm-workflows/weekly-reports/{date}-status.md
    evidence: true
    termination: "stop at audience length (internal 1p / client 1.5p / board 2p); no invented metrics"

  - id: skill-health
    when: "Monday 09:00 UTC"     # rides with freshness-audit + the skill-check CI Action
    skill: /skill-eval
    pulls: ["the top producer skills", "their evals/*-evals.json test cases"]
    output: pm-workflows/analysis/skill-evals/
    decides: "PM decides which flagged skills to tighten or rewrite"
    termination: "each evaluated skill has a 5-dimension scorecard + one verdict; no skill rewritten without approval"

  - id: monthly-pm-self-eval
    when: "monthly, 1st 09:00 local"
    skill: /monthly-pm-self-eval
    pulls: ["team/decisions/decisions.md", "recent Friday reports", "Linear"]
    output: pm-workflows/analysis/self-eval-{month}.md
    decides: "PM picks one improvement focus for the month"
    termination: "scored against PM standards; one focus named"

reactive:
  - id: premortem-high-stakes        # the auto-trigger — approved
    on: "new high-stakes row in product/roadmap/betting-table.md, OR a pricing change, OR a launch plan"
    skill: /premortem
    pulls: ["the bet/plan details", "product/roadmap/*", "relevant specs"]
    output: pm-workflows/analysis/premortem/
    decides: "PM signs off on the revised plan BEFORE the bet is committed"
    evidence: true
    termination: "report + transcript written; 3-sentence chat summary delivered"

  - id: evidence-gate
    on: "any strategy call / PRD / audit finding about to reach a stakeholder"
    skill: /evidence-loop
    pulls: ["the artifact under review", "its cited sources"]
    output: "appended to the artifact"
    decides: "human reads the evidence table before acting on the artifact"
    evidence: true
    termination: "every claim has one status row; flip-assumption + decision-owner named"

  - id: metric-breach
    on: "a tracked metric in product/analytics/metrics-dictionary.md crosses its threshold"
    skill: /data-analyst
    pulls: ["BigQuery", "funnel definitions"]
    output: pm-workflows/analysis/alert-{metric}-{date}.md
    decides: "PM decides whether to intervene"
    evidence: true
    termination: "breach quantified with source + date; likely cause hypothesized"

  - id: competitor-move
    on: "a competitor pricing/launch/hire signal surfaces"
    skill: /competitor-scan      # ⚠ template only — product-skills.md; build before wiring
    pulls: ["competitor sites", "positioning doc"]
    output: pm-workflows/market-research/competitor-{date}.md
    termination: "per-competitor section has all 5 fields; no industry overview"
