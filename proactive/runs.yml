# Proactive runs manifest — the human-readable list of everything that runs
# without being asked. Each entry names the mechanism that actually executes it
# (`binding`); nothing here is aspirational.
#
# binding values:
#   github-actions  a workflow in .github/workflows/ (named in `executor`); needs repo secrets
#   routine         a Claude Code routine (cloud). Create it with /schedule using the prompt
#                   file in `executor`. Research preview; minimum interval one hour.
#   desktop-task    same prompt file, run as a desktop scheduled task for teams that keep a
#                   machine awake (Claude Desktop → Code → Routines → New → Local)
#   hook            .claude/settings.json or skill frontmatter; fires inside a session
#   inline          built into the producing skills (no separate trigger)
#   manual          a human runs it on the cadence; listed so the rhythm is visible
#
# Fields: id, when | on, skill, binding, executor, pulls, output, steward, decides,
# evidence, termination. Every automated run writes to a repo path and opens a pull
# request or issue; none commits to the default branch.
# `node check-skills.mjs` verifies every skill named here exists and can be model-invoked.

defaults:
  steward: PM
  open: true          # output lands in the repo, visible to the team
  evidence: false     # true on any run whose output drives a decision

scheduled:
  - id: freshness-audit
    when: "Monday 09:00 UTC"
    skill: none                    # deterministic bash; no model, no API key
    binding: github-actions
    executor: .github/workflows/freshness-check.yml
    pulls: ["dated planning files"]
    output: "GitHub issue labelled freshness-check, listing stale files with owner roles"
    decides: "PM decides what to refresh vs. retire"
    termination: "every monitored file checked; stale ones listed with age"

  - id: artifact-grade
    when: "Monday 09:30 UTC"
    skill: /check-artifacts
    binding: github-actions
    executor: .github/workflows/artifact-grade.yml
    pulls: ["product/roadmap/*", "product/context.md"]
    output: "PR adding product/analysis/audit/artifacts-{date}.md"
    decides: "PM picks which fixes to make this week"
    termination: "every artifact graded; overall grade and ordered fix list written"

  - id: sprint-health
    when: "Monday 09:00 local"
    skill: /sprint-health
    binding: routine               # or desktop-task
    executor: proactive/routines/sprint-health.md
    pulls: ["issue tracker", "meeting notes"]
    output: "draft PR adding team/weekly-updates/{date}-sprint-health.md"
    decides: "PM triages flagged blockers before standup"
    termination: "report written; every flag has an owner role or 'PM to assign'"

  - id: monday-kickoff
    when: "Monday 09:30 local"
    skill: /cadence
    binding: routine               # or desktop-task
    executor: proactive/routines/monday-kickoff.md
    pulls: ["product/roadmap/current-bet.md", "issue tracker", "meeting notes"]
    output: "draft PR adding team/weekly-updates/{date}-kickoff.md"
    termination: "kickoff note written; one priority and its Friday criteria named"

  - id: midweek-pulse
    when: "Wednesday 12:00 local"
    skill: /cadence
    binding: routine               # or desktop-task
    executor: proactive/routines/midweek-pulse.md
    pulls: ["issue tracker progress vs. Monday kickoff"]
    output: "draft PR adding team/weekly-updates/{date}-pulse.md"
    termination: "pulse note written; each success criterion marked done / in progress / at risk"

  - id: friday-refresh
    when: "Friday 15:00 UTC"
    skill: team-os-agent:refresh   # roadmap-keeper agent
    binding: github-actions
    executor: .github/workflows/roadmap-refresh.yml
    pulls: ["Linear GraphQL API (LINEAR_API_KEY)"]
    output: "PR updating product/roadmap/current-bet.md, betting-table.md, experiment-roadmap.md"
    decides: "PM sets next week's bet"
    termination: "factual fields updated with query date, or no change if Linear is unreachable"

  - id: friday-decide
    when: "Friday 15:30 local"
    skill: /cadence
    binding: routine               # or desktop-task
    executor: proactive/routines/friday-decide.md
    pulls: ["issue tracker closed this week", "meeting notes", "this week's notes"]
    output: "draft PR adding team/weekly-updates/{date}-friday.md and {date}-update.md"
    evidence: true
    termination: "Friday note with iterate/swing call and evidence loop; update drafted; nothing sent"

  - id: skill-health
    when: "monthly, first Monday"
    skill: /skill-eval
    binding: manual                # needs an authenticated `claude plugin eval`
    executor: evals/README.md
    pulls: ["evals/<skill>/*/case.yaml"]
    output: product/analysis/skill-evals/
    decides: "PM decides which flagged skills to tighten"
    termination: "each evaluated skill has a five-dimension scorecard and one verdict"

  - id: monthly-pm-self-eval
    when: "monthly, 1st working day"
    skill: /monthly-pm-self-eval   # disable-model-invocation: the PM runs it by name
    binding: manual
    pulls: ["team/decisions/decisions.md", "Friday notes", "issue tracker"]
    output: product/analysis/monthly/pm-self-eval-{month}.md
    decides: "PM picks one behavior to change"
    termination: "every dimension scored with evidence; one behavior named"

reactive:
  - id: premortem-high-stakes
    on: "product/roadmap/betting-table.md changes (new high-stakes bet, pricing change, launch plan)"
    skill: /premortem
    binding: hook
    executor: ".claude/settings.json → PostToolUse (Edit|Write) and FileChanged → scripts/hooks/bet-changed.mjs"
    output: product/analysis/premortem/
    decides: "PM signs off on the revised plan before the bet is committed"
    evidence: true
    termination: "report + transcript written; 3-sentence summary delivered"

  - id: evidence-gate
    on: "a strategy call, PRD, audit finding, or Friday note is produced"
    skill: /evidence-loop
    binding: inline                # strategy, audit, pm-super-agent, cadence (Friday) append it
    output: "Evidence Loop appendix on the artifact"
    decides: "a human reads the evidence table before acting"
    evidence: true
    termination: "every claim has one status row; flip-assumption and decision owner named"

  - id: metric-breach
    on: "a metric in product/analytics/metrics-dictionary.md crosses its threshold"
    skill: /data-analyst
    binding: manual                # no metric monitor ships with team-os; wire one to a routine if you have it
    output: product/analysis/data/alert-{metric}-{date}.md
    decides: "PM decides whether to intervene"
    evidence: true
    termination: "breach quantified with source and date; likely cause hypothesized"
